apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: orders-ms
  name: orders-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-ms
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: orders-ms
    spec:
      containers:
      - image: northamerica-south1-docker.pkg.dev/store-microservices-443121/image-registry/orders-ms
        name: orders-ms
        env:
          - name: PORT
            value: "3502"
          - name: DATABASE_URL
            valueFrom :
              secretKeyRef:
                name: orders-secrets
                key: order_db_url
          - name: PRODUCT_MS_URL
            value: "local"
          - name: PRODUCT_MS_PORT
            value: "1000"
          - name: NATS_SERVERS
            value: "nats://nats"
        resources: {}
status: {}
