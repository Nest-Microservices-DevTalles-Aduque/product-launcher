version: '3'

services:
  nats-server:
    image: nats:latest
    ports:
      - 8222:8222
  client-gateway:
    build: ./client-gateway
    ports:
      - 3501:3501
    volumes:
      - ./client-gateway/src:/usr/src/app/src
    command: npm run start:dev
    env_file:
      - ./client-gateway/.env
  ms-products:
    build: ./products-ms
    ports:
      - 3001:3001
    volumes:
      - ./products-ms/src:/usr/src/app/src
    command: npm run start:docker
    env_file:
      - ./products-ms/.env
  ms-orders:
    build: ./orders-ms
    ports:
      - 3502:3502
    volumes:
      - ./orders-ms/src:/usr/src/app/src
    command: npm run start:docker
    env_file:
      - ./orders-ms/.env
  ms-payment:
    container_name: payment_container
    build: ./payment-ms
    ports:
      - 3503:3503
    volumes:
      - ./payment-ms/src:/usr/src/app/src
    command: npm run start:dev
    env_file:
      - ./payment-ms/.env
  ms-auth:
    container_name: auth-ms
    build: ./auth-ms
    ports:
      - 3504:3504
    volumes:
      - ./auth-ms/src:/usr/src/app/src
    command: npm run start:dev
    env_file:
      - ./auth-ms/.env

