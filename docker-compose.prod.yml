version: '3'

services:
  nats-server:
    image: nats:latest
    ports:
      - 8222:8222
  client-gateway:
    build:
      context: ./client-gateway
      dockerfile: prod.Dockerfile
    image: northamerica-south1-docker.pkg.dev/store-microservices-443121/image-registry/client-gateway
    ports:
      - ${CLIENT_GATEWAY_PORT}:${CLIENT_GATEWAY_PORT}
    environment:
      - PORT=${CLIENT_GATEWAY_PORT}
      - PRODUCT_MS_PORT=${PRODUCT_MS_PORT}
      - PRODUCT_MS_URL=${PRODUCT_MS_URL}
      - ORDER_MS_PORT=${ORDER_MS_PORT}
      - ORDER_MS_URL=${ORDER_MS_URL}
      - NATS_SERVERS=${NATS_SERVERS}
  ms-products:
    build:
      context: ./products-ms
      dockerfile: prod.Dockerfile
    image: northamerica-south1-docker.pkg.dev/store-microservices-443121/image-registry/ms-products
    ports:
      - ${PRODUCT_MS_PORT}:${PRODUCT_MS_PORT}
    environment:
      - PORT=${PRODUCT_MS_PORT}
      - DATABASE_URL=file:./dev.db
      - NATS_SERVERS=${NATS_SERVERS}
  ms-orders:
    image: northamerica-south1-docker.pkg.dev/store-microservices-443121/image-registry/orders-ms
    build:
      context: ./orders-ms
      dockerfile: prod.Dockerfile
      args:
        - ORDERS_DB_URL=${ORDERS_DB_URL}
    ports:
      - ${ORDER_MS_PORT}:${ORDER_MS_PORT}
    environment:
      - DATABASE_URL=${ORDERS_DB_URL}
      - NATS_SERVERS=${NATS_SERVERS}
      - PRODUCT_MS_URL=${PRODUCT_MS_URL}
      - PRODUCT_MS_PORT=${PRODUCT_MS_PORT}
      - PORT=${ORDER_MS_PORT}
  ms-payment:
    image: northamerica-south1-docker.pkg.dev/store-microservices-443121/image-registry/ms-payment
    container_name: payment_container
    build:
      context: ./payment-ms
      dockerfile: prod.Dockerfile
    ports:
      - ${PAYMENT_MS_PORT}:${PAYMENT_MS_PORT}
    environment:
      - PORT=${PAYMENT_MS_PORT}
      - NATS_SERVERS=${NATS_SERVERS}
      - STRIPE_SECRET=${STRIPE_SECRET}
      - PAYMENT_SUCCESS_URL=${PAYMENT_SUCCESS_URL}
      - PAYMENT_CANCEL_URL=${PAYMENT_CANCEL_URL}
      - ENDPOINT_SECRET=${PAYMENT_ENDPOINT_SECRET}
  ms-auth:
    build:
      context: ./auth-ms
      dockerfile: prod.Dockerfile
    container_name: auth-ms
    image: northamerica-south1-docker.pkg.dev/store-microservices-443121/image-registry/auth-ms
    environment:
      - PORT=${AUTH_MS_PORT}
      - AUTH_DATABASE_URL=${AUTH_DATABASE_URL}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - NATS_SERVERS=${NATS_SERVERS}


