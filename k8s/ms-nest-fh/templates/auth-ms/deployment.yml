apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: auth-ms
  name: auth-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-ms
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: auth-ms
    spec:
      containers:
      - image: northamerica-south1-docker.pkg.dev/store-microservices-443121/image-registry/auth-ms
        name: auth-ms
        env:
          - name: PORT
            value: "3504"
          - name: AUTH_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: auth-ms-secrets
                key: auth_db_url
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: auth-ms-secrets
                key: auth_db_url
          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: auth-ms-secrets
                key: jwt_secret
          - name: NATS_SERVERS
            value: "nats://nats"
        resources: {}
status: {}
